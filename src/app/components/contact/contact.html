<section id="contact" class="max-w-6xl mx-auto py-16 px-6">
    <h2 class="text-3xl font-bold mb-10 text-gradient text-center"> Contact </h2>
    <div class="grid md:grid-cols-2 gap-4 items-center"> <!-- Imagen -->
        <div class="flex justify-center">
            <div class="hidden md:block rounded-3xl overflow-hidden drop-shadow-[0_0_25px_rgba(59,130,246,0.4)]"> <img
                    src="img/form_img.png" alt="Contacto" class="w-full max-w-md" /> </div>
        </div> <!-- Formulario -->
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
            <div class="flex flex-col gap-1.5">
                <label for="name" class="text-sm font-medium text-zinc-300 ml-1">Name</label>
                <input id="name" type="text" placeholder="Your name" formControlName="name"
                    [class.border-red-500]="form.controls.name.touched && form.controls.name.invalid"
                    [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid ? 'true' : null"
                    class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-sm font-medium text-zinc-300 ml-1">Email</label>
                <input id="email" type="email" placeholder="Your email" formControlName="email"
                    [class.border-red-500]="form.controls.email.touched && form.controls.email.invalid"
                    [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid ? 'true' : null"
                    class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="message" class="text-sm font-medium text-zinc-300 ml-1">Message</label>
                <textarea id="message" rows="5" placeholder="Your message" formControlName="message"
                    [class.border-red-500]="form.controls.message.touched && form.controls.message.invalid"
                    [attr.aria-invalid]="form.controls.message.touched && form.controls.message.invalid ? 'true' : null"
                    class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <button type="submit" [disabled]="sending"
                class="px-6 py-3 rounded-xl bg-indigo-500 hover:bg-indigo-600 transition text-white font-semibold w-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 disabled:opacity-50 disabled:cursor-not-allowed">
                {{ sending ? 'Sending...' : 'Send message' }}
            </button>
            @if (success) { <p role="status" class="text-green-400 mt-3 text-center">Message sent successfully</p> }
            @if (error) { <p role="alert" class="text-red-400 mt-3 text-center">Error sending message</p> }
        </form>
    </div>
</section>
